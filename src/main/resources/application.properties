spring.application.name=shop-here

spring.datasource.url=jdbc:postgresql://localhost:5432/shophere
spring.datasource.username=postgres
spring.datasource.password=hello

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=my_super_secret_key_which_is_long_and_random
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG

# Root log level (whole project)
logging.level.root=INFO

# Your project base package
logging.level.com.shop_here=DEBUG

# Spring framework logs
logging.level.org.springframework.web=DEBUG

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

